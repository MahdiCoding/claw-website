backend:
  name: github
  repo: MahdiCoding/claw-website
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "products"
    label: "Products"
    label_singular: "Product"
    folder: "_products"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name (English)", name: "name", widget: "string" }
      - { label: "Product Name (Arabic)", name: "nameAr", widget: "string" }
      - { label: "Price (EGP)", name: "price", widget: "number", value_type: "int" }
      - { label: "Sale Price — leave 0 for no sale", name: "salePrice", widget: "number", value_type: "int", default: 0, required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Streetwear", value: "streetwear" }
          - { label: "Luxury", value: "luxury" }
          - { label: "Accessories", value: "accessories" }
      - { label: "Product Image", name: "image", widget: "image", required: false }
      - label: "Sizes"
        name: "sizes"
        widget: "select"
        multiple: true
        options: ["XS", "S", "M", "L", "XL", "XXL", "ONE SIZE"]
      - label: "Badge"
        name: "badge"
        widget: "select"
        default: ""
        options:
          - { label: "None", value: "" }
          - { label: "NEW", value: "NEW" }
          - { label: "LIMITED", value: "LIMITED" }
          - { label: "BESTSELLER", value: "BESTSELLER" }
          - { label: "SALE", value: "SALE" }
          - { label: "SOLD OUT", value: "SOLD OUT" }
      - label: "Sold Out?"
        name: "soldOut"
        widget: "boolean"
        default: false
